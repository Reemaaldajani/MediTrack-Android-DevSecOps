
name: Android CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Android APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MediTrack-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error


      - name: Send ntfy notification
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            MESSAGE="SUCCESS: MediTrack Android CI completed successfully!"
          else
            MESSAGE="FAILED: MediTrack Android CI needs attention."
          fi

          curl --fail --silent --show-error \
            -H "Title: MediTrack Android CI" \
            -d "$MESSAGE" \
            "https://ntfy.sh/${NTFY_TOPIC}" || echo "ntfy notification failed"
