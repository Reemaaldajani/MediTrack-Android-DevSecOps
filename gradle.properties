# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true

# AndroidX support
android.useAndroidX=true
android.enableJetifier=true

# Fix for "Could not connect to Kotlin compile daemon"
# Increases memory for the Kotlin compiler daemon
kotlin.daemon.jvmargs=-Xmx1024m
# Provides a fallback if the daemon fails to start
kotlin.daemon.useFallbackStrategy=true

# Use 'out-of-process' execution strategy to bypass daemon connection issues.
# This avoids "Could not connect to Kotlin compile daemon" by running 
# the compiler in a fresh process for each task.
kotlin.compiler.execution.strategy=out-of-process
